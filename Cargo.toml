[package]
name = "iventoymersed"
version = "3.2.0"
edition = "2021"
description = "iventoymersed: 100% Pure Rust Dual-Engine Network Boot Server with In-Tree NBD & iSCSI Target Manager"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["io"] }
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
